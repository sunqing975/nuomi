[package]
name = "nuomi-desktop"
version = "0.1.0"
description = "糯米 · 陪伴型个人智能体（桌面端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nuomi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
