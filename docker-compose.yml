# 糯米 · docker compose：backend + frontend（Web 部署形态）
# 决策 1：多用户移除 → 无 postgres；SQLite 单文件挂持久卷。
# 端口避开本机开发服务（8000/5173）：后端 8001、前端 8090
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: deepseek-chat
      LLM_BASE_URL: https://api.deepseek.com
      HF_ENDPOINT: https://hf-mirror.com
      # 容器内无仓库：资源与数据路径显式指定（config 默认值在容器内解析不到）
      PLUGINS_DIR: /app/plugins
      PARTNERS_DIR: /app/partners
      NUOMI_HOME: /app/data
      WORKSPACE_DIR: /app/workspace
    ports:
      - "8001:8000"
    volumes:
      - nuomi-data:/app/data
      - nuomi-workspace:/app/workspace

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  nuomi-data:
  nuomi-workspace:
