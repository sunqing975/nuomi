# 糯米 · docker compose：postgres + backend + frontend
# 端口已避开本机开发服务（8000/5173/5432）：后端 8001、前端 8080、PG 5433
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nuomi
      POSTGRES_USER: nuomi
      POSTGRES_PASSWORD: nuomi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuomi -d nuomi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      CHECKPOINTER: postgres
      PG_DSN: postgresql://nuomi:nuomi@postgres:5432/nuomi
      LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: deepseek-chat
      LLM_BASE_URL: https://api.deepseek.com
      HF_ENDPOINT: https://hf-mirror.com
      # 容器内路径（config.py 的 REPO_ROOT 在 /app 下解析不到，显式指定）
      SKILLS_DIR: /app/skills
      PARTNERS_DIR: /app/partners
      DB_PATH: /app/data/nuomi.sqlite
      MEMORY_FILE: /app/data/memories/nuomi/facts.json
      TRACE_FILE: /app/data/logs/trace.jsonl
      USERS_FILE: /app/data/users.json
      KNOWLEDGE_DIR: /app/data/knowledge
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  pgdata:
