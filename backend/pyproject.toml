[project]
name = "nuomi-backend"
version = "0.2.0"
description = "糯米 V2 · 全能型个人智能体（桌面优先，单一数据根）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "chromadb>=0.5",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
