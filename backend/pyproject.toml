[project]
name = "nuomi-backend"
version = "0.13.0"
description = "糯米 · 桌面 AI 人格工作台（octop-harness 为机制基础库，业务层自己写）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Agent 运行时：octop-harness（机制基础库，v0.13 起不再自研 engine）。
    # harness 依赖 langchain>=1.5 / langgraph<2 / deepagents / octop-memory，版本由它约束。
    "octop-harness>=1.0.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
